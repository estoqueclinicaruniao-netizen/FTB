<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomba Patch PS1 - Edição Nostalgia</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; }

    /* HUD ESTILO PS1 / RETRÔ */
    #hud-top {
      position: absolute; top: 15px; left: 30px; display: flex; align-items: stretch;
      border: 3px solid #ccc; background: #000; z-index: 10; box-shadow: 4px 4px 0 rgba(0,0,0,0.8);
    }
    .team-box {
      padding: 5px 20px; font-size: 20px; font-weight: 900; letter-spacing: 2px;
      display: flex; align-items: center; text-transform: uppercase; color: #fff;
    }
    .bg-red { background: #d32f2f; }
    .bg-blue { background: #1976d2; }
    
    .score-box {
      background: #fff; color: #000; font-size: 30px;
      font-weight: 900; padding: 0 15px; display: flex; align-items: center;
    }
    .time-box {
      background: #222; color: #00ff00; font-size: 22px;
      font-weight: bold; padding: 5px 15px; display: flex; align-items: center;
    }

    /* MENSAGENS DE JOGO ESTILO ARCADE */
    #narrator {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #000; border: 2px solid #fff; padding: 10px 25px; 
      font-size: 16px; font-weight: bold; color: #fff; z-index: 10;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.8); text-transform: uppercase;
    }

    #event-banner {
      position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%) scale(0.1);
      background: #000; padding: 15px 40px; border: 4px solid #fff;
      color: #fff; font-size: 40px; font-weight: 900; letter-spacing: 2px;
      text-shadow: 2px 2px 0 #ff0000; opacity: 0; transition: all 0.3s ease-out; z-index: 20;
    }
    #event-banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

    /* CONTROLES TÁTICOS */
    #controls {
      position: absolute; top: 80px; left: 30px; background: rgba(0,0,0,0.8);
      border: 2px solid #555; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10;
    }
    #controls label { font-size: 12px; font-weight: bold; color: #00ff00; text-transform: uppercase; }
    select {
      background: #222; color: #fff; border: 1px solid #777; padding: 6px;
      font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; outline: none; cursor: pointer;
    }

    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
  </style>
</head>
<body>

  <div id="hud-top">
    <div class="team-box bg-red">RED</div>
    <div class="score-box"><span id="scoreRed">0</span>-<span id="scoreBlue">0</span></div>
    <div class="team-box bg-blue">BLU</div>
    <div class="time-box" id="clock">00:00</div>
  </div>

  <div id="controls">
    <label>Câmera Retro</label>
    <select id="camMode">
      <option value="pes" selected>Wide (Estilo PS1)</option>
      <option value="tv">Transmissão</option>
    </select>
  </div>

  <div id="narrator">BOMBA PATCH PS1. BOLA AO CENTRO!</div>
  <div id="event-banner">GOLO!</div>

  <div id="webgl-canvas"></div>

  <script>
    // ============================================================================
    // 1. CONSTANTES E FORMAÇÕES
    // ============================================================================
    const PITCH_L = 105; 
    const PITCH_W = 68;
    const GOAL_W = 14.6; 
    const GOAL_H = 4.5;

    const FORMATIONS = {
      '4-4-2': [
        { role:'GK', x:-0.46, z:0 },
        { role:'LB', x:-0.3, z:-0.35 }, { role:'CB', x:-0.34, z:-0.12 }, { role:'CB', x:-0.34, z:0.12 }, { role:'RB', x:-0.3, z:0.35 },
        { role:'LM', x:-0.08, z:-0.35 }, { role:'CM', x:-0.12, z:-0.1 }, { role:'CM', x:-0.12, z:0.1 }, { role:'RM', x:-0.08, z:0.35 },
        { role:'ST', x:0.18, z:-0.15 }, { role:'ST', x:0.18, z:0.15 }
      ]
    };

    // ============================================================================
    // 2. CONFIGURAÇÃO GRÁFICA (ESTILO PS1 LOW POLY)
    // ============================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1420); // Céu noturno

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias false para visual mais retro
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('webgl-canvas').appendChild(renderer.domElement);

    // Iluminação mais dura (estilo jogos antigos)
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(20, 80, -20);
    sun.castShadow = true;
    sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
    scene.add(sun);

    // Relvado
    function buildPitchTexture() {
      const cv = document.createElement('canvas'); cv.width=1024; cv.height=512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#166534'; ctx.fillRect(0,0,1024,512);
      for(let i=0; i<16; i+=2) { ctx.fillStyle = '#15803d'; ctx.fillRect(i*64,0,64,512); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.strokeRect(30, 20, 964, 472);
      ctx.beginPath(); ctx.moveTo(512,20); ctx.lineTo(512,492); ctx.stroke();
      ctx.beginPath(); ctx.arc(512,256,70,0,Math.PI*2); ctx.stroke();
      ctx.strokeRect(30,125,140,262); ctx.strokeRect(854,125,140,262);
      return new THREE.CanvasTexture(cv);
    }
    
    const pitch = new THREE.Mesh(new THREE.PlaneGeometry(PITCH_L, PITCH_W), new THREE.MeshLambertMaterial({ map: buildPitchTexture() }));
    pitch.rotation.x = -Math.PI/2; pitch.receiveShadow = true; scene.add(pitch);

    const apron = new THREE.Mesh(new THREE.PlaneGeometry(PITCH_L+40, PITCH_W+30), new THREE.MeshLambertMaterial({ color: 0x064e3b }));
    apron.rotation.x = -Math.PI/2; apron.position.y = -0.1; scene.add(apron);

    // Balizas Quadradas (Low Poly)
    function createGoal(xPos) {
      const gGroup = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({color:0xffffff});
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, GOAL_H, 0.2), mat); p1.position.set(0, GOAL_H/2, -GOAL_W/2); gGroup.add(p1);
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, GOAL_H, 0.2), mat); p2.position.set(0, GOAL_H/2, GOAL_W/2); gGroup.add(p2);
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, GOAL_W), mat); bar.position.set(0, GOAL_H, 0); gGroup.add(bar);
      
      const net = new THREE.Mesh(new THREE.BoxGeometry(3, GOAL_H, GOAL_W), new THREE.MeshBasicMaterial({color:0xdddddd, wireframe:true, transparent:true, opacity:0.3}));
      net.position.set(xPos > 0 ? 1.5 : -1.5, GOAL_H/2, 0); gGroup.add(net);
      
      gGroup.position.x = xPos; scene.add(gGroup);
    }
    createGoal(PITCH_L/2); createGoal(-PITCH_L/2);

    // ============================================================================
    // 3. FÍSICA DA BOLA (COM CURVA CORRIGIDA)
    // ============================================================================
    class Ball {
      constructor() {
        this.radius = 0.42;
        this.pos = new THREE.Vector3(0, this.radius, 0);
        this.vel = new THREE.Vector3(0, 0, 0);
        this.spin = 0; 
        
        // Bola Low Poly (Icosaedro)
        this.mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(this.radius, 1), new THREE.MeshLambertMaterial({color: 0xffffff}));
        this.mesh.castShadow = true; scene.add(this.mesh);

        this.shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0), new THREE.MeshBasicMaterial({color: 0x000, transparent: true, opacity: 0.5, depthWrite: false}));
        this.shadow.rotation.x = -Math.PI/2; scene.add(this.shadow);
      }

      reset(x, z) {
        this.pos.set(x, this.radius, z);
        this.vel.set(0, 0, 0);
        this.spin = 0;
      }

      kick(dir, force, lift, curve = 0) {
        this.vel.copy(dir).normalize().multiplyScalar(force);
        this.vel.y = lift;
        // Limita a curva para não ser irreal (Magnus Effect)
        this.spin = Math.max(-0.015, Math.min(0.015, curve));
      }

      update() {
        this.pos.add(this.vel);
        this.vel.y -= 0.024; // Gravidade
        
        // Aplica Efeito (Curva)
        if (this.pos.y > this.radius && this.spin !== 0) {
          const lateral = new THREE.Vector3(-this.vel.z, 0, this.vel.x).normalize();
          this.vel.add(lateral.multiplyScalar(this.spin * this.vel.length()));
          this.spin *= 0.98; // Curva perde força no ar
        }

        // Quique na Grama
        if (this.pos.y <= this.radius) {
          this.pos.y = this.radius;
          this.vel.y *= -0.55;
          if (Math.abs(this.vel.y) < 0.1) this.vel.y = 0;
          this.vel.x *= 0.98;
          this.vel.z *= 0.98;
          this.spin = 0; // Perde efeito ao tocar no chão
        } else {
          this.vel.x *= 0.995;
          this.vel.z *= 0.995;
        }

        if (this.vel.lengthSq() < 0.0001) this.vel.set(0,0,0);

        this.mesh.position.copy(this.pos);
        this.mesh.rotation.x += this.vel.z * 0.3;
        this.mesh.rotation.z -= this.vel.x * 0.3;

        this.shadow.position.set(this.pos.x, 0.02, this.pos.z);
      }
    }

    // ============================================================================
    // 4. MODELO DO JOGADOR PS1 (BOX GEOMETRY)
    // ============================================================================
    class Player {
      constructor(team, num, role) {
        this.team = team; this.num = num; this.role = role;
        this.pos = new THREE.Vector3(); this.vel = new THREE.Vector3();
        this.home = new THREE.Vector3();
        
        this.state = 'IDLE';
        this.cooldown = 0;
        this.speedLimit = role === 'GK' ? 0.25 : (0.35 + Math.random()*0.06);
        this.animPhase = Math.random() * Math.PI;

        this.buildRig();
      }

      buildRig() {
        this.group = new THREE.Group();
        const matShirt = new THREE.MeshLambertMaterial({color: this.role==='GK'?(this.team==='red'?0xffff00:0xff00ff):(this.team==='red'?0xcc0000:0x0000cc)});
        const matSkin = new THREE.MeshLambertMaterial({color: 0xffccaa});
        const matShorts = new THREE.MeshLambertMaterial({color: 0xffffff});
        const matBoots = new THREE.MeshLambertMaterial({color: 0x111111});

        this.pelvis = new THREE.Group(); this.pelvis.position.y = 1.0; this.group.add(this.pelvis);
        
        // Torso Largo (Box)
        this.torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.4), matShirt);
        this.torso.position.y = 0.4; this.torso.castShadow = true; this.pelvis.add(this.torso);

        // Cabeça Quadrada/Low Poly
        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matSkin);
        this.head.position.y = 1.0; this.head.castShadow = true; this.pelvis.add(this.head);

        const buildLimb = (x, isArm) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), isArm ? matSkin : matShorts);
          m.position.set(x, isArm ? 0.4 : -0.35, 0); m.castShadow = true;
          this.pelvis.add(m); return m;
        };
        // Braços
        this.armL = buildLimb(-0.5, true); this.armR = buildLimb(0.5, true);
        // Pernas (com chuteiras embutidas visuais)
        this.legL = buildLimb(-0.2, false); this.legR = buildLimb(0.2, false);
        
        const bootGeo = new THREE.BoxGeometry(0.22, 0.15, 0.35);
        const bootL = new THREE.Mesh(bootGeo, matBoots); bootL.position.set(0, -0.3, 0.05); this.legL.add(bootL);
        const bootR = new THREE.Mesh(bootGeo, matBoots); bootR.position.set(0, -0.3, 0.05); this.legR.add(bootR);

        scene.add(this.group);
      }

      setSpawn(x, z) {
        this.pos.set(x, 0, z); this.home.set(x, 0, z);
        this.vel.set(0,0,0); this.group.position.copy(this.pos);
      }

      steer(targetPos, speedFactor = 1.0) {
        if(this.state === 'TACKLE' || this.state === 'STUN') return;
        
        const dir = targetPos.clone().sub(this.pos);
        dir.y = 0;
        if (dir.length() < 0.1) return;

        dir.normalize().multiplyScalar(this.speedLimit * speedFactor);
        this.vel.lerp(dir, 0.15);
      }

      update() {
        if(this.cooldown > 0) this.cooldown--;
        if(this.cooldown <= 0 && this.state !== 'IDLE' && this.state !== 'RUN') this.state = 'IDLE';

        if(this.state === 'TACKLE') { this.pelvis.rotation.x = -1.2; this.pelvis.position.y = 0.3; this.vel.multiplyScalar(0.8); }
        else if(this.state === 'STUN') { this.pelvis.rotation.z = 0.5; this.pelvis.position.y = 0.8; this.vel.multiplyScalar(0.8); }
        else { this.pelvis.rotation.set(0,0,0); this.pelvis.position.y = 1.0; }

        this.pos.add(this.vel);
        this.vel.multiplyScalar(0.85);

        // Respeita as 4 linhas
        this.pos.x = Math.max(-PITCH_L/2 + 1, Math.min(PITCH_L/2 - 1, this.pos.x));
        this.pos.z = Math.max(-PITCH_W/2 + 1, Math.min(PITCH_W/2 - 1, this.pos.z));

        this.group.position.copy(this.pos);

        const spd = this.vel.length();
        if(spd > 0.02 && (this.state === 'IDLE' || this.state === 'RUN')) {
          this.group.rotation.y = Math.atan2(this.vel.x, this.vel.z);
          this.animPhase += spd * 1.5;
          const s = Math.sin(this.animPhase) * 0.8;
          this.legL.rotation.x = -s; this.legR.rotation.x = s;
          this.armL.rotation.x = s;  this.armR.rotation.x = -s;
          this.torso.rotation.x = 0.15;
        } else if (this.state === 'IDLE') {
          this.legL.rotation.x = 0; this.legR.rotation.x = 0;
          this.armL.rotation.x = 0; this.armR.rotation.x = 0;
          this.torso.rotation.x = 0;
        }
      }
    }

    // ============================================================================
    // 5. MOTOR DO JOGO (COM BOLAS PARADAS)
    // ============================================================================
    class MatchEngine {
      constructor() {
        this.ball = new Ball();
        this.players = [];
        this.state = 'KICKOFF';
        this.timer = 0;
        this.carrier = null;
        this.score = { red:0, blue:0 };
        this.clock = 0;
        this.lastTouch = null; // Guarda quem tocou por último
        this.setPieceTaker = null;

        for(let i=0; i<11; i++) this.players.push(new Player('red', i+1, FORMATIONS['4-4-2'][i].role));
        for(let i=0; i<11; i++) this.players.push(new Player('blue', i+1, FORMATIONS['4-4-2'][i].role));
        
        this.applyTactics();
        this.resetField('red');
      }

      applyTactics() {
        const form = FORMATIONS['4-4-2'];
        ['red', 'blue'].forEach(team => {
          this.players.filter(p => p.team===team).forEach((p, i) => {
            p.role = form[i].role;
            let px = form[i].x * PITCH_L; let pz = form[i].z * PITCH_W;
            if(team==='blue') { px = -px; pz = -pz; }
            p.home.set(px, 0, pz);
          });
        });
      }

      resetField(kTeam) {
        this.ball.reset(0,0);
        this.carrier = null;
        this.players.forEach(p => { p.setSpawn(p.home.x, p.home.z); p.state = 'IDLE'; p.cooldown = 0; });
        const st = this.players.find(p => p.team === kTeam && p.role.includes('ST'));
        if(st) st.setSpawn(kTeam==='red'?-1.5:1.5, 0);
        this.state = 'KICKOFF'; this.timer = 50;
      }

      showBanner(text) {
        const b = document.getElementById('event-banner');
        b.innerText = text; b.classList.add('show');
        setTimeout(() => b.classList.remove('show'), 2000);
      }

      msg(text) { document.getElementById('narrator').innerText = text; }

      // PREPARAÇÃO PARA BOLAS PARADAS (Escanteio, Lateral, Tiro de Meta)
      setupSetPiece(type, attackingTeam, ballX, ballZ) {
        this.state = type;
        this.timer = 80; // Tempo de arrumação
        this.ball.reset(ballX, ballZ);
        this.carrier = null;

        // Seleciona o cobrador
        if (type === 'GOAL_KICK') {
          this.setPieceTaker = this.players.find(p => p.team === attackingTeam && p.role === 'GK');
        } else {
          // Pega o jogador de linha mais próximo do local
          let closest = null; let minD = Infinity;
          this.players.forEach(p => {
            if (p.team === attackingTeam && p.role !== 'GK') {
              const d = p.pos.distanceTo(this.ball.pos);
              if (d < minD) { minD = d; closest = p; }
            }
          });
          this.setPieceTaker = closest;
        }

        // Posiciona os jogadores
        this.players.forEach(p => {
          p.state = 'IDLE'; p.vel.set(0,0,0);
          if (p === this.setPieceTaker) {
            // Cobrador fica atrás da bola
            const offsetX = (type === 'THROW_IN') ? 0 : (attackingTeam === 'red' ? -1.5 : 1.5);
            const offsetZ = (type === 'THROW_IN') ? Math.sign(ballZ) * 1.5 : 0;
            p.pos.set(ballX + offsetX, 0, ballZ + offsetZ);
            p.group.position.copy(p.pos);
          } else {
            // Outros jogadores
            if (type === 'CORNER') {
              // Vão para a área
              const targetGoalX = attackingTeam === 'red' ? PITCH_L/2 - 10 : -PITCH_L/2 + 10;
              p.pos.lerp(new THREE.Vector3(targetGoalX + (Math.random()-0.5)*15, 0, (Math.random()-0.5)*15), 0.8);
            } else {
              p.pos.lerp(p.home, 0.5); // Aproximam-se da casa
            }
            p.group.position.copy(p.pos);
          }
        });

        this.msg(`${type.replace('_',' ')} PARA O ${attackingTeam === 'red' ? 'RED' : 'BLU'}`);
      }

      executeSetPiece() {
        const taker = this.setPieceTaker;
        const isAtkRight = taker.team === 'red';
        const oppGoalX = isAtkRight ? PITCH_L/2 : -PITCH_L/2;

        if (this.state === 'CORNER') {
          // Cruzamento para a área
          const aim = new THREE.Vector3(oppGoalX - taker.pos.x, 0, -taker.pos.z).normalize();
          this.ball.kick(aim, 1.2, 0.35, (taker.pos.z > 0 ? 0.01 : -0.01)); // Cruzamento com curva
          this.msg("Cruzamento para a área!");
        } 
        else if (this.state === 'THROW_IN') {
          // Passe lateral com a mão (sem lift)
          const mates = this.players.filter(m => m.team === taker.team && m !== taker);
          const target = mates.sort((a,b) => a.pos.distanceTo(taker.pos) - b.pos.distanceTo(taker.pos))[0];
          const aim = target.pos.clone().sub(taker.pos).normalize();
          this.ball.kick(aim, 0.8, 0);
          this.msg("Lançamento lateral efetuado.");
        }
        else if (this.state === 'GOAL_KICK') {
          // Chutão pra frente
          const aim = new THREE.Vector3(isAtkRight ? 1 : -1, 0, 0);
          this.ball.kick(aim, 1.4, 0.3);
          this.msg("Tiro de meta longo!");
        }

        taker.cooldown = 30;
        this.state = 'PLAYING';
      }

      update() {
        this.ball.update();

        // Evita colagem entre jogadores (Soft Collision)
        for (let i=0; i<this.players.length; i++) {
          for (let j=i+1; j<this.players.length; j++) {
            const p1 = this.players[i]; const p2 = this.players[j];
            const dist = p1.pos.distanceTo(p2.pos);
            if (dist > 0 && dist < 1.2) {
              const push = p1.pos.clone().sub(p2.pos).normalize().multiplyScalar((1.2 - dist)*0.4);
              p1.pos.add(push); p2.pos.sub(push);
            }
          }
        }

        if (this.state === 'KICKOFF') {
          this.timer--;
          if (this.timer <= 0) {
            this.state = 'PLAYING';
            this.msg("APITO DO ÁRBITRO!");
          }
        }
        else if (this.state === 'CORNER' || this.state === 'THROW_IN' || this.state === 'GOAL_KICK') {
          this.timer--;
          this.setPieceTaker.group.rotation.y = Math.atan2(this.ball.pos.x - this.setPieceTaker.pos.x, this.ball.pos.z - this.setPieceTaker.pos.z);
          if (this.timer <= 0) {
            this.executeSetPiece();
          }
        }
        else if (this.state === 'PLAYING') {
          this.clock += 0.02;
          const mins = Math.floor(this.clock / 60); const secs = Math.floor(this.clock % 60);
          document.getElementById('clock').innerText = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

          let cRed=null, cBlue=null, dRed=999, dBlue=999;
          this.players.forEach(p => {
            if(p.role==='GK') return;
            const d = p.pos.distanceTo(this.ball.pos);
            if(p.team==='red' && d<dRed) { dRed=d; cRed=p; }
            if(p.team==='blue' && d<dBlue) { dBlue=d; cBlue=p; }
          });

          // Rastrear último toque
          if (this.carrier) this.lastTouch = this.carrier.team;
          else {
            this.players.forEach(p => { if(p.pos.distanceTo(this.ball.pos) < 1.0) this.lastTouch = p.team; });
          }

          // Lógica Individual da IA
          this.players.forEach(p => {
            const isAtk = p.team === 'red';
            const oppGoalX = isAtk ? PITCH_L/2 : -PITCH_L/2;
            const ownGoalX = isAtk ? -PITCH_L/2 : PITCH_L/2;

            if (p.role === 'GK') {
              const tz = Math.max(-GOAL_W/2+1, Math.min(GOAL_W/2-1, this.ball.pos.z * 0.5));
              p.steer(new THREE.Vector3(ownGoalX + (isAtk ? 2 : -2), 0, tz), 1.0);
              
              if (this.ball.pos.distanceTo(p.pos) < 3.5 && this.ball.vel.lengthSq() > 0.05 && p.cooldown <= 0) {
                p.cooldown = 40; p.state = 'FALL';
                this.ball.kick(new THREE.Vector3(isAtk?1:-1, 1, (Math.random()-0.5)).normalize(), 0.7, 0.4);
                this.msg("ESPALMA O GOLEIRO!");
                this.lastTouch = p.team;
              }
            } 
            else if (this.carrier === p) {
              p.cooldown++; 
              
              const fwd = new THREE.Vector3(Math.sin(p.group.rotation.y), 0, Math.cos(p.group.rotation.y)).multiplyScalar(0.8);
              this.ball.pos.set(p.pos.x + fwd.x, this.ball.radius, p.pos.z + fwd.z);
              this.ball.vel.set(0,0,0);

              const distGoal = Math.abs(p.pos.x - oppGoalX);
              if (distGoal < 26) {
                this.carrier = null; p.cooldown = 20;
                const aim = new THREE.Vector3(oppGoalX - p.pos.x, 0, (Math.random()-0.5)*5 - p.pos.z).normalize();
                this.ball.kick(aim, 1.25, 0.2, (Math.random()-0.5)*0.015); // Chute com curva
                this.msg(`BATIDA FORTE DO #${p.num}!`);
              } else if (p.cooldown > 40) {
                // Passe Inteligente
                const mates = this.players.filter(m => m.team===p.team && m!==p && m.role!=='GK');
                let best = null; let bScore = -999;
                mates.forEach(m => {
                  const d = p.pos.distanceTo(m.pos);
                  if(d>6 && d<35) {
                    // Impede passar se tiver rival no meio
                    let blocked = false;
                    this.players.filter(opp => opp.team !== p.team).forEach(opp => {
                      // Verificações simples
                      if (opp.pos.distanceTo(p.pos) < d && opp.pos.distanceTo(m.pos) < d) {
                        const passLine = m.pos.clone().sub(p.pos).normalize();
                        const toOpp = opp.pos.clone().sub(p.pos);
                        if (toOpp.dot(passLine) > 0 && toOpp.clone().cross(passLine).length() < 1.5) blocked = true;
                      }
                    });
                    if (!blocked) {
                      const s = (isAtk ? m.pos.x : -m.pos.x) * 2 - d;
                      if(s > bScore) { bScore=s; best=m; }
                    }
                  }
                });
                this.carrier = null; p.cooldown = 20;
                if(best) {
                  const aim = best.pos.clone().sub(p.pos).normalize();
                  this.ball.kick(aim, 0.9, 0.02);
                  this.msg(`Toca a bola #${p.num}.`);
                } else {
                  this.ball.kick(new THREE.Vector3(isAtk?1:-1, 0, 0), 1.0, 0.3); // Chutão
                }
              } else {
                p.steer(new THREE.Vector3(oppGoalX, 0, 0), 0.85); // Corre com a bola
              }
            }
            else if ((p === cRed || p === cBlue) && !this.carrier) {
              p.steer(this.ball.pos, 1.0);
              if (p.pos.distanceTo(this.ball.pos) < 1.2 && p.cooldown <= 0) {
                this.carrier = p; p.cooldown = 0;
              }
            }
            else if ((p === cRed || p === cBlue) && this.carrier && this.carrier.team !== p.team) {
              p.steer(this.carrier.pos, 1.0);
              if (p.pos.distanceTo(this.carrier.pos) < 1.5 && p.cooldown <= 0) {
                this.carrier.state = 'STUN'; this.carrier.cooldown = 35;
                p.state = 'TACKLE'; p.cooldown = 25;
                this.carrier = null;
                const dir = new THREE.Vector3((Math.random()-0.5), 0, (Math.random()-0.5)).normalize();
                this.ball.kick(dir, 0.6, 0.1);
                this.lastTouch = p.team;
                this.msg(`Corte providencial!`);
              }
            }
            else {
              let tg = p.home.clone();
              if (this.carrier && this.carrier.team === p.team) {
                if (p.role.includes('ST') || p.role.includes('W')) tg.x += isAtk ? 18 : -18;
                else { tg.x += (this.carrier.pos.x - p.home.x)*0.4; tg.z += (this.carrier.pos.z - p.home.z)*0.3; }
              } else {
                tg.x += this.ball.pos.x * 0.3; tg.z += this.ball.pos.z * 0.15;
              }
              p.steer(tg, 0.7);
            }

            p.update();
          });

          // SAÍDAS DE BOLA (LATERAIS, ESCANTEIOS, TIRO DE META)
          const bx = this.ball.pos.x; const bz = this.ball.pos.z;
          
          if (Math.abs(bx) > PITCH_L/2 + 0.5) { // Passou da linha de fundo
            if (Math.abs(bz) < GOAL_W/2 && this.ball.pos.y < GOAL_H) {
              this.scoreGoal(bx > 0 ? 'red' : 'blue');
            } else {
              // Escanteio ou Tiro de Meta?
              const defTeam = bx > 0 ? 'blue' : 'red';
              const atkTeam = bx > 0 ? 'red' : 'blue';
              
              if (this.lastTouch === defTeam) {
                // Tocou no defensor: ESCANTEIO
                this.setupSetPiece('CORNER', atkTeam, Math.sign(bx) * PITCH_L/2, Math.sign(bz) * PITCH_W/2);
              } else {
                // Tocou no atacante: TIRO DE META
                this.setupSetPiece('GOAL_KICK', defTeam, Math.sign(bx) * (PITCH_L/2 - 5), 0);
              }
            }
          } 
          else if (Math.abs(bz) > PITCH_W/2 + 0.5) { // Passou da linha lateral
             const outTeam = this.lastTouch === 'red' ? 'blue' : 'red';
             this.setupSetPiece('THROW_IN', outTeam, bx, Math.sign(bz) * PITCH_W/2);
          }
        }
        else if (this.state === 'GOAL') {
          this.timer--;
          this.players.forEach(p => p.update());
          if (this.timer <= 0) {
            document.getElementById('goal-banner').classList.remove('show');
            this.resetField(this.scorerTeam === 'red' ? 'blue' : 'red');
          }
        }
      }

      scoreGoal(team) {
        this.score[team]++;
        document.getElementById('scoreRed').innerText = this.score.red;
        document.getElementById('scoreBlue').innerText = this.score.blue;
        this.scorerTeam = team;
        this.state = 'GOAL'; this.timer = 150;
        this.showBanner('GOLO!');
        this.msg("O ESTÁDIO VEM ABAIXO!");
      }
    }

    // ============================================================================
    // 6. INICIALIZAÇÃO
    // ============================================================================
    const engine = new MatchEngine();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      engine.update();

      const bPos = engine.ball.mesh.position;
      const camMode = document.getElementById('camMode').value;
      
      if (engine.state === 'GOAL') {
        camera.position.lerp(new THREE.Vector3(bPos.x, 15, bPos.z + 20), 0.05);
        camera.lookAt(bPos);
      } else if (camMode === 'pes') {
        camera.position.lerp(new THREE.Vector3(bPos.x * 0.7, 35, 55), 0.05);
        camera.lookAt(bPos.x * 0.8, 0, bPos.z * 0.3);
      } else {
        camera.position.lerp(new THREE.Vector3(0, 40, 65), 0.05);
        camera.lookAt(bPos);
      }

      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
